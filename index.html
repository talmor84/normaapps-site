<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Norma — Independent Software Publisher</title>
  <meta name="description" content="Norma is an independent software publisher building software, intelligence, and digital experiences.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fbfbfa">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://normaapps.com/">
  <meta property="og:title" content="Norma">
  <meta property="og:description" content="Independent Software Publisher. Building software, intelligence, and digital experiences.">
  <meta property="og:url" content="https://normaapps.com/">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #fbfbfa;
      --ink: #111111;
      --muted: #5f5f5c;
      --faint: #9a9a96;
      --rule: #dcdcd8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100svh;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(3.25rem, 11vw, 6.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      margin: 0;
    }
    .role {
      margin: 1.5rem 0 0;
      font-size: clamp(0.72rem, 2.4vw, 0.82rem);
      font-weight: 500;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .rule {
      width: 40px;
      height: 1px;
      background: var(--rule);
      border: 0;
      margin: 2.25rem auto;
    }
    .line {
      margin: 0;
      max-width: 30ch;
      font-size: clamp(1.05rem, 3.4vw, 1.25rem);
      line-height: 1.55;
      color: var(--muted);
    }
    .soon {
      margin: 2.75rem 0 0;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
    }
    footer {
      padding: 24px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--faint);
    }
  </style>
</head>
<body>
  <main>
    <h1>Norma</h1>
    <p class="role">Independent Software Publisher</p>
    <hr class="rule">
    <p class="line">Building software, intelligence, and digital experiences.</p>
    <p class="soon">Coming Soon</p>
  </main>
  <footer>&copy; <span id="y">2026</span> Norma</footer>
  <script>document.getElementById("y").textContent = new Date().getFullYear();</script>
</body>
</html>
